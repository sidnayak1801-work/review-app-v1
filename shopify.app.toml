# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5583660bf73cc180c986fcedf3977151"
name = "ReviewX"
application_url = "https://review-app-v1.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products, write_products"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/fulfilled"
  topics = [ "orders/fulfilled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://review-app-v1.onrender.com/api/auth" ]

[app_proxy]
url = "/api/storefront/reviews"
subpath = "reviews"
prefix = "apps"

[build]
# TEMP local testing: true so `shopify app dev` points App URL + proxy at the
# tunnel (not Render). Set false + restore Render URLs before production again.
automatically_update_urls_on_dev = true
