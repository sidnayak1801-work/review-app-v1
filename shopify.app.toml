# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "5583660bf73cc180c986fcedf3977151"
name = "ReviewTrix"
application_url = "https://reviewtrix.algorithmtrix.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_orders,read_products,read_themes"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/orders/fulfilled"
  topics = [ "orders/fulfilled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[auth]
redirect_urls = [ "https://reviewtrix.algorithmtrix.com/api/auth" ]

[app_proxy]
url = "/api/storefront/reviews"
subpath = "reviews"
prefix = "apps"

[build]
# Keep false so `shopify app dev` does not rewrite Coolify Partner URLs to a tunnel.
automatically_update_urls_on_dev = false
