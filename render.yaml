# Render Web Service defaults for review-app-v1 (Neon Postgres + Shopify).
# Dashboard env vars still required: DATABASE_URL, DIRECT_URL, SHOPIFY_*.
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: review-app-v1
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    healthCheckPath: /health?ready=1
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: read_orders
      - key: BILLING_TEST_MODE
        value: "true"
      - key: SHOPIFY_APP_URL
        value: https://review-app-v1.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
