# Fly.io production app for the Shopify review MVP.
# After first deploy, set SHOPIFY_APP_URL (secret/env) to https://<app>.fly.dev
# Docs: docs/12_DEPLOYMENT.md

app = "review-app-v1"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"
  SCOPES = "read_orders"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health?ready=1"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
